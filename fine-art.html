<style>
  @font-face{font-family:'Urbanist';src:url('assets/fonts/Urbanist-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
  @font-face{font-family:'Urbanist';src:url('assets/fonts/Urbanist-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
  @font-face{font-family:'Urbanist';src:url('assets/fonts/Urbanist-Medium.ttf') format('truetype');font-weight:600 700;font-display:swap;}
  :root{
    --ink:#1f2027;
    --paper:#f9f9f9;
    --line:#dcdcdc;
    --accent:#5869b6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:var(--paper);color:var(--ink);
    font-family:'Urbanist',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:32px;
  }
  h1,h2{font-family:'Urbanist',sans-serif;font-weight:500;margin:0;letter-spacing:-0.01em;}
  .wrap{max-width:520px;}
  .eyebrow{
    font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);
    font-weight:600;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:var(--accent);display:inline-block;}
  h1{font-size:clamp(28px,4vw,44px);}
  p{font-size:17px;line-height:1.6;color:#3a3d47;margin:20px 0 34px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:14px 26px;border-radius:100px;
    font-family:'Urbanist',sans-serif;font-size:14px;font-weight:500;text-decoration:none;
    border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    transition:background .2s ease,border-color .2s ease;
  }
  .btn:hover{background:var(--accent);border-color:var(--accent);}

  /* BEREICHS-SWITCHER BADGE (identischer Aufbau wie auf der Grafikdesign-Seite) */
  .badge{
    position:fixed;display:block;
    right:28px;bottom:28px;
    width:104px;height:104px;
    z-index:90;cursor:pointer;
    transition:transform .3s ease;
  }
  .badge:hover{transform:scale(1.05);}
  .badge svg{width:100%;height:100%;}
  .badge .ring-text{animation:spin 16s linear infinite;transform-origin:52px 52px;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @media(max-width:600px){.badge{width:82px;height:82px;right:16px;bottom:16px;}}
</style>
</head>

<div class="wrap">
  <div class="eyebrow">Fine Art</div>

  <p>Hier findest du bald Alexandrus freie künstlerische Arbeiten — Zeichnung, Malerei und alles, was jenseits von Kommunikationsdesign entsteht.</p>
